# Увеличиваем лимиты памяти
org.gradle.jvmargs=-Xmx3G -Dkotlin.daemon.jvm.options\="-Xmx2048M"

# Включаем быстрые функции
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Таймауты для медленного интернета
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

## Версии Minecraft и Forge
minecraft_version=1.19.2
minecraft_version_range=[1.19.2,1.20)
forge_version=43.5.0
forge_version_range=[43,)
loader_version_range=[43,)
mapping_channel=official
mapping_version=1.19.2

## Параметры мода (обязательные для build.gradle)
mod_id=zitraksmode
mod_version=1.19.2-1.2.0
mod_group_id=com.example.zitraksmode
mod_name=Zitraks Mode
mod_license=MIT
mod_authors=QLS СЕНЯ
mod_description=хуй